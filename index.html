    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);

        try {
          const parsed = JSON.parse(raw);
          // 补齐新模块
          if (!parsed.modules) parsed.modules = MODULE_ORDER.slice();
          MODULE_ORDER.forEach(key => { if (!parsed.modules.includes(key)) parsed.modules.push(key); });
          Object.keys(moduleDefs).forEach(key => {
            if (!parsed[key]) {
              parsed[key] = moduleDefs[key].defaultItems
                ? moduleDefs[key].defaultItems.map(text => createItem(text))
                : [];
            }
            if (!parsed[key + "_chat"]) parsed[key + "_chat"] = [];
          });
          if (!parsed.diaries) parsed.diaries = [];
          if (!parsed.selectedDiaryId) parsed.selectedDiaryId = null;
          if (!parsed.diary_chat) parsed.diary_chat = [];
          if (!parsed.bookNotes) parsed.bookNotes = [];
          if (parsed.fileSyncConnected === undefined) parsed.fileSyncConnected = false;
          if (!parsed.crucible) parsed.crucible = [];
          if (!parsed.questions) parsed.questions = [];
          return mergeBuiltInKnowledge(parsed);
        } catch (e) {}
      }
      const fresh = { modules: MODULE_ORDER.slice(), activeModule: "daily" };

        fresh[key] = moduleDefs[key].defaultItems
          ? moduleDefs[key].defaultItems.map(text => createItem(text))
          : [];

    function mergeBuiltInKnowledge(data, force = false) {
      Object.keys(BUILTIN_KNOWLEDGE).forEach(key => {
        if (!data[key]) data[key] = [];
        if (force) data[key] = data[key].filter(item => !item.builtinKey);
        BUILTIN_KNOWLEDGE[key].forEach(item => {
          const exists = data[key].some(existing => existing.builtinKey === item.builtinKey);
          if (!exists) data[key].push(createItem(item.text, {
            title: item.title,
            source: item.source,
            builtinKey: item.builtinKey,
            builtIn: true
          }));
        });
      });
      data.dataVersion = WORKBENCH_DATA_VERSION;
      return data;
    }

    async function restoreDiariesFromFile() {

        if (!resp.ok) return;
        const data = await resp.json();
        if (!data.diaries || data.diaries.length === 0) return;
        // 只补充 localStorage 中不存在的日记，不覆盖已有数据
        const localIds = new Set((state.diaries || []).map(d => d.id));
        let added = 0;

          renderNav();

        }
      } catch(e) { console.log('日记文件恢复跳过:', e.message); }
    }

    // ===== IndexedDB 全量备份（比 localStorage 更持久，自动触发） =====
    function idbBackupDiaries() {
      try {
        var req = indexedDB.open('astro_workbench_db', 1);
        req.onupgradeneeded = function(e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains('diaries')) db.createObjectStore('diaries', { keyPath: 'key' });
        };
        req.onsuccess = function(e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains('diaries')) return;
          var tx = db.transaction('diaries', 'readwrite');
          var store = tx.objectStore('diaries');
          // 全量备份（所有模块数据）
          store.put({ key: 'full_state_backup', state: state, savedAt: new Date().toISOString() });
          // 兼容旧版日记备份
          store.put({ key: 'diary_backup', diaries: state.diaries || [], selectedDiaryId: state.selectedDiaryId, diary_chat: state.diary_chat || [], savedAt: new Date().toISOString() });
        };
        req.onerror = function() {};
      } catch(e) {}
    }

    function idbRestoreDiaries() {
      return new Promise(function(resolve) {
        try {
          var req = indexedDB.open('astro_workbench_db', 1);
          req.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('diaries')) db.createObjectStore('diaries', { keyPath: 'key' });
          };
          req.onsuccess = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('diaries')) { resolve(0); return; }
            var tx = db.transaction('diaries', 'readonly');
            var store = tx.objectStore('diaries');
            // 优先尝试全量备份恢复
            var getReq = store.get('full_state_backup');
            getReq.onsuccess = function(ev) {
              var data = ev.target.result;
              if (data && data.state) {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) {
                  state = mergeBuiltInKnowledge(data.state);
                  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                  renderNav();
                  switchModule(state.activeModule || 'daily');
                  console.log('从 IndexedDB 全量备份恢复了数据');
                  resolve(1);
                  return;
                }
              }
              // 回退到旧版日记恢复
              var getReq2 = store.get('diary_backup');
              getReq2.onsuccess = function(ev2) {
                var d = ev2.target.result;
                if (!d || !d.diaries || d.diaries.length === 0) { resolve(0); return; }
                var localIds = new Set((state.diaries || []).map(function(x) { return x.id; }));
                var added = 0;
                d.diaries.forEach(function(fd) {
                  if (fd.id && !localIds.has(fd.id)) { state.diaries = state.diaries || []; state.diaries.push(fd); added++; }
                });
                if (added > 0) {
                  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                  renderNav();
                  if (activeModule === 'writing') renderModule();
                  console.log('从 IndexedDB 恢复了 ' + added + ' 条日记');
                }
                resolve(added);
              };
              getReq2.onerror = function() { resolve(0); };
            };
            getReq.onerror = function() { resolve(0); };
          };
          req.onerror = function() { resolve(0); };
        } catch(e) { resolve(0); }
      });
    }

          <span class="nav-count">${count}</span>

        `;

        div.ondragstart = (e) => { e.dataTransfer.setData("idx", idx); div.classList.add("dragging"); };
        div.ondragend = () => div.classList.remove("dragging");
        div.ondragover = (e) => e.preventDefault();
        div.ondrop = (e) => reorder(e.dataTransfer.getData("idx"), idx);
        list.appendChild(div);
      });
    }

    function reorder(from, to) {
      from = parseInt(from); to = parseInt(to);
      if (from === to) return;
      const item = state.modules.splice(from, 1)[0];

      saveState();
      renderNav();

    function addDiary() {

      if (!state.diaries) state.diaries = [];
      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
      const entry = {
        id: Date.now().toString() + Math.random().toString(36).slice(2),
        date: todayStr(),
        time: timeStr,
        title: title || '',
        content: content
      };
      state.diaries.push(entry);
      saveState();
      idbBackupDiaries();
      renderModule();
      toast("已记录");
    }

      idbBackupDiaries();
      renderModule();

    let diarySaveTimer = null;
    function onDiaryInput() {
      const titleEl = document.getElementById('diary-edit-title');
      const contentEl = document.getElementById('diary-edit-content');
      const wcEl = document.getElementById('diary-word-count');
      const statusEl = document.getElementById('diary-save-status');
      if (!titleEl || !contentEl) return;
      if (wcEl) wcEl.textContent = contentEl.value.length + '字';
      if (statusEl) statusEl.innerHTML = '<span class="diary-save-dot" style="background:#e8a838;"></span>编辑中...';
      if (diarySaveTimer) clearTimeout(diarySaveTimer);
      diarySaveTimer = setTimeout(function() { saveDiaryNow(); }, 300);
    }

    function saveDiaryNow() {
      try {
        if (diarySaveTimer) { clearTimeout(diarySaveTimer); diarySaveTimer = null; }
        var titleEl = document.getElementById('diary-edit-title');
        var contentEl = document.getElementById('diary-edit-content');
        var statusEl = document.getElementById('diary-save-status');
        if (!titleEl || !contentEl) { console.log('saveDiaryNow: 编辑器元素不存在'); return; }
        if (!state.diaries || !Array.isArray(state.diaries)) state.diaries = [];
        var d = null;
        if (state.selectedDiaryId) {
          d = state.diaries.find(function(x) { return x.id === state.selectedDiaryId; });
        }
        // 如果选中的日记不存在，自动创建一条新日记
        if (!d) {
          d = {
            id: Date.now().toString() + Math.random().toString(36).slice(2),
            date: todayStr(),
            time: nowText().split(' ')[1] || '',
            title: '',
            content: ''
          };
          state.diaries.push(d);
          state.selectedDiaryId = d.id;
          console.log('saveDiaryNow: 自动创建了新日记', d.id);
        }
        // 读取标题和内容，同时兼容 value 和 textContent
        d.title = (titleEl.value || titleEl.textContent || '').trim();
        d.content = contentEl.value || contentEl.textContent || '';
        d.date = d.date || todayStr();
        // 更新字数显示
        var wcEl = document.getElementById('diary-word-count');
        if (wcEl) wcEl.textContent = d.content.length + '字';
        // 保存到 localStorage
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch(storageErr) {
          console.error('localStorage 保存失败:', storageErr);
          toast('存储空间不足，请导出备份后清理');
          return;
        }
        // IndexedDB 备份
        idbBackupDiaries();
        // 更新状态显示
        if (statusEl) statusEl.innerHTML = '<span class="diary-save-dot"></span>已保存 ✓';
        // 文件同步
        syncToFile();
        // GitHub 云端自动同步（3秒延迟）
        githubAutoSync();
        // 重新渲染左侧日记列表（显示最新标题）
        if (activeModule === 'writing') {
          var notesList = document.getElementById('diary-notes-list');
          if (notesList) {
            var diaryList = state.diaries.slice().reverse();
            var grouped = {};
            diaryList.forEach(function(d) {
              var dk = d.date || '未知日期';
              if (!grouped[dk]) grouped[dk] = [];
              grouped[dk].push(d);
            });
            var dateKeys = Object.keys(grouped).sort().reverse();
            var listHtml = '';
            var todayD = todayStr();
            var yesterdayD = new Date(Date.now() - 86400000).toISOString().slice(0,10);
            dateKeys.forEach(function(dateKey) {
              var dateLabel = dateKey;
              if (dateKey === todayD) dateLabel = '今天';
              else if (dateKey === yesterdayD) dateLabel = '昨天';
              else dateLabel = dateKey.replace(/^\\d{4}-/, '').replace('-', '月') + '日';
              listHtml += '<div class="diary-date-section">' + escapeHtml(dateLabel) + '</div>';
              grouped[dateKey].forEach(function(item) {
                var isActive = item.id === state.selectedDiaryId;
                var titleDisplay = item.title || '新记录';
                var preview = (item.content || '').slice(0, 50).replace(/\\n/g, ' ');
                listHtml += '<div class="diary-note-card' + (isActive ? ' active' : '') + '" onclick="selectDiary(\'' + item.id + '\')">' +
                  '<div class="diary-note-card-title">' + escapeHtml(titleDisplay) + '</div>' +
                  '<div class="diary-note-card-preview">' + escapeHtml(preview) + '</div>' +
                  '<div class="diary-note-card-meta">' + (item.time || '') + '</div>' +
                '</div>';
              });
            });
            notesList.innerHTML = listHtml;
          }
        }
      } catch(err) {
        console.error('saveDiaryNow 出错:', err);
        toast('保存出错: ' + err.message);
      }
    }

    // ===== 文件永久存储 =====
    let diaryFileHandle = null;

    async function connectFileSync() {
      if (!window.showSaveFilePicker) {
        toast('浏览器不支持文件存储，已用浏览器保存+导出功能替代');
        manualExportDiary();
        return;
      }
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: 'diary_data.json',
          types: [{ description: '日记数据', accept: { 'application/json': ['.json'] } }]
        });
        diaryFileHandle = handle;
        state.fileSyncConnected = true;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        await syncToFile();
        const statusEl = document.getElementById('diary-sync-status');
        if (statusEl) statusEl.textContent = '✅ 已连接永久存储';
        toast('已连接永久存储，日记将自动保存到文件');
      } catch(e) {
        if (e.name !== 'AbortError') toast('连接失败：' + e.message);
      }
    }

    async function syncToFile() {
      if (!diaryFileHandle) return;
      try {
        const writable = await diaryFileHandle.createWritable();
        const data = {
          diaries: state.diaries || [],
          selectedDiaryId: state.selectedDiaryId,
          diary_chat: state.diary_chat || [],
          savedAt: new Date().toISOString()
        };
        await writable.write(JSON.stringify(data, null, 2));
        await writable.close();
      } catch(e) { console.log('文件同步跳过:', e.message); }
    }

    async function loadFromFile() {
      if (!diaryFileHandle) return false;
      try {
        const file = await diaryFileHandle.getFile();
        const text = await file.text();
        const data = JSON.parse(text);
        if (data.diaries && data.diaries.length > 0) {
          if (!state.diaries || state.diaries.length === 0) {
            state.diaries = data.diaries;
            state.selectedDiaryId = data.selectedDiaryId || null;
            state.diary_chat = data.diary_chat || [];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            return true;
          }
          // 合并：以文件中的新条目补充
          const existingIds = new Set(state.diaries.map(d => d.id));
          let added = 0;
          data.diaries.forEach(fd => {
            if (!existingIds.has(fd.id)) { state.diaries.push(fd); added++; }
          });
          if (added > 0) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            toast('从文件恢复了 ' + added + ' 条记录');
            return true;
          }
        }
      } catch(e) { console.log('文件读取跳过:', e.message); }
      return false;
    }

    function manualExportDiary() {
      const data = {
        diaries: state.diaries || [],
        diary_chat: state.diary_chat || [],
        savedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'diary_data.json';
      a.click();
      URL.revokeObjectURL(url);
      toast('已导出日记文件，保存到工作台文件夹');
    }

    function importVoiceConversation() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.txt,.md,.json';
      input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
          const text = ev.target.result;
          if (!state.writing) state.writing = [];
          state.writing.push(createItem(text, {
            title: file.name.replace(/\.[^.]+$/, '') + "（语音对话）",
            source: "TRAE手机版语音导入"
          }));
          saveState();
          renderModule();
          toast("已导入语音对话，点击“总结最新语音”生成摘要");
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function summarizeLatestVoice() {
      const items = state.writing || [];
      const voiceItems = items.filter(i => i.source && i.source.includes("语音"));
      if (voiceItems.length === 0) {
        toast("暂无语音对话记录，请先导入");
        return;
      }
      const latest = voiceItems[voiceItems.length - 1];
      const text = latest.text || "";
      const sentences = text.split(/[。！？\n.!?]/).filter(s => s.trim().length > 5);
      const summary = sentences.slice(0, 5).join("；");
      const fullSummary = `【语音总结 ${latest.created || ""}】${summary}...（原文${text.length}字，已提取${Math.min(sentences.length, 5)}个要点）`;
      state.writing.push(createItem(fullSummary, {
        title: "语音对话总结",
        source: "自动总结"
      }));
      saveState();
      renderModule();
      toast("已生成语音总结并保存到灵感内容");
    }

    // === 每本书的思想熔炉关联 ===
    function renderBookCrucible(note) {
      const crucible = state.crucible || [];
      if (crucible.length === 0) return '';

      const fullText = ((note.title || '') + ' ' + (note.note || '')).toLowerCase();
      const related = [];
      const linked = [];

      crucible.forEach(topic => {
        // 关键词匹配评分
        let score = 0;
        const titleWords = topic.title.split(/[\s,，、]+/).filter(w => w.length > 1);
        titleWords.forEach(w => { if (fullText.includes(w.toLowerCase())) score += 3; });
        if (topic.content) {
          const contentWords = topic.content.split(/[\s,，、。]+/).filter(w => w.length > 2);
          contentWords.forEach(w => { if (fullText.includes(w.toLowerCase())) score += 1; });
        }
        // 检查是否已同步
        const isSynced = (topic.syncedNotes || []).some(sn => sn.bookTitle === note.title);
        if (isSynced) {
          linked.push(topic);
        } else if (score >= 3) {
          related.push({ topic, score });
        }
      });

      // 按匹配度排序
      related.sort((a, b) => b.score - a.score);

      let html = `<div class="book-crucible">
        <div class="book-crucible-head">🔥 思想熔炉 · 观点关联</div>`;

      if (linked.length > 0) {
        linked.forEach(topic => {
          html += `<div class="book-crucible-linked">
            <span class="book-crucible-topic">✅ ${escapeHtml(topic.title)}</span>
            <span class="book-crucible-linked-badge">已同步</span>
          </div>`;
        });
      }

      if (related.length > 0) {
        related.forEach(({ topic, score }) => {
          const preview = (topic.content || '').substring(0, 60).replace(/\n/g, ' ');
          html += `<div class="book-crucible-match">
            <div>
              <div class="book-crucible-topic">🔗 ${escapeHtml(topic.title)}</div>
              ${preview ? `<div class="book-crucible-preview">${escapeHtml(preview)}...</div>` : ''}
            </div>
            <button class="book-crucible-sync-btn" onclick="syncBookToCrucible('${note.id}','${topic.id}')">同步到此</button>
          </div>`;
        });
      }

      if (linked.length === 0 && related.length === 0) {
        html += `<div class="book-crucible-empty">暂无自动关联的主题。可手动选择同步：</div>`;
      }

      // 手动选择同步
      const unlinked = crucible.filter(t => !linked.some(l => l.id === t.id));
      if (unlinked.length > 0) {
        html += `<div class="book-crucible-manual">
          <select id="manual-crucible-${note.id}">
            <option value="">选择主题...</option>
            ${unlinked.map(t => `<option value="${t.id}">${escapeHtml(t.title)}</option>`).join('')}
          </select>
          <button class="book-crucible-sync-btn" onclick="manualSyncBookToCrucible('${note.id}')">手动同步</button>
        </div>`;
      }

      html += `</div>`;
      return html;
    }

      if (linked.length === 0 && related.length === 0) {
        html += `<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px;background:rgba(0,0,0,.02);border-radius:10px;">
          暂无自动关联的主题。<br>

      const unlinked = crucible.filter(t => !linked.some(l => l.id === t.id));
      if (unlinked.length > 0) {

        </div>`;
      }

      html += `</div>`;
      return html;

    function manualSyncBookToCrucibleFull(noteId) {
      const select = document.getElementById('manual-crucible-full-' + noteId);
      if (!select || !select.value) { toast('请先选择主题'); return; }
      syncBookToCrucible(noteId, select.value);
    }

    function quickAddCrucibleFromBook(noteId) {
      if (!state.bookNotes) return;
      const note = state.bookNotes.find(b => b.id === noteId);
      if (!note) return;
      if (!state.crucible) state.crucible = [];
      const id = Date.now().toString() + Math.random().toString(36).slice(2);
      state.crucible.push({
        id: id,
        title: '来自《' + (note.title || '') + '》的观点',
        content: '',
        created: nowText(),
        updated: nowText(),
        syncedNotes: []
      });
      crucibleExpanded[id] = true;
      saveState();
      syncBookToCrucible(noteId, id);
    }

    function unsyncBookFromCrucible(noteId, topicId) {
      if (!state.bookNotes || !state.crucible) return;
      const note = state.bookNotes.find(b => b.id === noteId);
      const topic = state.crucible.find(t => t.id === topicId);
      if (!note || !topic) return;
      if (topic.syncedNotes) {
        topic.syncedNotes = topic.syncedNotes.filter(sn => sn.bookTitle !== note.title);
      }
      saveState();
      renderModule();
      toast('已取消同步');
    }

    function viewCrucibleTopic(topicId) {
      libView = 'grid';
      libHomeTab = 'crucible';
      crucibleExpanded[topicId] = true;
      renderModule();
      setTimeout(() => {
        const el = document.querySelector('[data-id="' + topicId + '"]');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
    }

    // === 书籍详情页：问题库关联 ===
    function renderBookQuestions(note, catInfo) {
      const questions = state.questions || [];
      if (questions.length === 0) return '';

      const fullText = ((note.title || '') + ' ' + (note.note || '')).toLowerCase();
      const related = [];
      const linked = [];

      questions.forEach(q => {
        let score = 0;
        const titleWords = q.title.split(/[\s,，、]+/).filter(w => w.length > 1);
        titleWords.forEach(w => { if (fullText.includes(w.toLowerCase())) score += 3; });
        if (q.content) {
          const contentWords = q.content.split(/[\s,，、。]+/).filter(w => w.length > 2);
          contentWords.forEach(w => { if (fullText.includes(w.toLowerCase())) score += 1; });
        }
        const isLinked = (q.answers || []).some(a => a.bookTitle === note.title);
        if (isLinked) {
          linked.push(q);
        } else if (score >= 3) {
          related.push({ question: q, score });
        }
      });
      related.sort((a, b) => b.score - a.score);

      if (linked.length === 0 && related.length === 0) return '';

      let html = `<div class="book-questions-section" style="margin-bottom:20px;">
        <div style="font-size:16px;font-weight:800;color:var(--ink);margin-bottom:10px;">❓ 问题库关联</div>`;

      if (linked.length > 0) {
        html += `<div style="font-size:12px;font-weight:700;color:#228b57;margin-bottom:6px;">✅ 已关联问题（${linked.length}个）</div>`;
        linked.forEach(q => {
          html += `<div style="background:rgba(34,139,87,.06);border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:13px;">
            <span style="font-weight:700;">${escapeHtml(q.title)}</span>
            <span style="font-size:10px;padding:1px 6px;border-radius:4px;background:rgba(34,139,87,.12);color:#228b57;margin-left:6px;">已关联</span>
          </div>`;
        });
      }

      if (related.length > 0) {
        html += `<div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;margin-top:8px;">🔗 可能相关的问题（${related.length}个）</div>`;
        related.forEach(({ question: q, score }) => {
          html += `<div style="background:rgba(45,91,209,.06);border-radius:8px;padding:10px 12px;margin-bottom:6px;">
            <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px;">${escapeHtml(q.title)}</div>
            <button class="btn btn-primary" onclick="syncBookToQuestion('${note.id}','${q.id}')" style="font-size:11px;padding:3px 10px;">添加此书观点</button>
          </div>`;
        });
      }

      html += `</div>`;
      return html;
    }

    function syncBookToQuestion(noteId, questionId) {
      if (!state.bookNotes || !state.questions) return;
      const note = state.bookNotes.find(b => b.id === noteId);
      const q = state.questions.find(qq => qq.id === questionId);
      if (!note || !q) return;
      if (!q.answers) q.answers = [];
      q.answers.push({
        bookTitle: note.title,
        readTime: note.created || nowText(),
        noteContent: note.note || '',
        syncedAt: nowText()
      });
      q.updated = nowText();
      saveState();
      renderModule();
      toast('已添加《' + note.title + '》的观点到问题「' + q.title + '」');
    }

    function buildReadingProfile() {
      const bookNotes = state.bookNotes || [];
      const crucible = state.crucible || [];
      const questions = state.questions || [];
      const allTexts = [];
      const catCounts = {};
      LIB_CATEGORIES.forEach(c => catCounts[c.key] = 0);
      bookNotes.forEach(b => {
        allTexts.push((b.title || '') + ' ' + (b.author || '') + ' ' + (b.note || '') + ' ' + (b.tags || []).map(t => t.text).join(' '));
        const cat = b.category || 'astrology';
        if (catCounts[cat] !== undefined) catCounts[cat]++;
      });
      crucible.forEach(t => { allTexts.push((t.title || '') + ' ' + (t.content || '')); });
      questions.forEach(q => { allTexts.push((q.title || '') + ' ' + (q.content || '')); });
      const fullText = allTexts.join(' ').toLowerCase();
      const keywordMap = {};
      const allKeywords = ['占星','星座','行星','宫位','相位','解盘','本命盘','行运','推运','月亮','太阳','上升','水星','金星','火星','木星','土星','天王星','海王星','冥王星','凯龙','南北交','交点','合盘','比较盘','业力','轮回','因果','前世','灵魂','进化','转化','阴影','原型','潜意识','自性化','荣格','心理','分析','疗愈','创伤','亲密','关系','依恋','投射','情绪','沟通','边界','自我','成长','觉醒','灵性','修持','觉悟','无常','空性','慈悲','正念','当下','临在','觉知','意识','梦境','象征','炼金术','个体化','自性','阿尼玛','阿尼姆斯','情结','面具','共时性','业障','功德','中阴','转世','催眠','回溯','原生家庭','童年','伴侣','两性','爱情','婚姻','羞耻','脆弱','勇气','接纳','整合','改变','课题','模式','恐惧','焦虑','回避','安全','给予','需求','感受','观察','请求','冲突','连接'];
      allKeywords.forEach(kw => {
        const lowerKw = kw.toLowerCase();
        let count = 0, idx = 0;
        while ((idx = fullText.indexOf(lowerKw, idx)) !== -1) { count++; idx += lowerKw.length; }
        if (count > 0) keywordMap[kw] = count;
      });
      const sortedKeywords = Object.entries(keywordMap).sort((a, b) => b[1] - a[1]);
      return { totalBooks: bookNotes.length, totalNotes: bookNotes.length, totalCrucible: crucible.length, totalQuestions: questions.length, catCounts, keywords: sortedKeywords, fullText };
    }

    function generateBookRecommendations() {
      const profile = buildReadingProfile();
      const existingTitles = (state.bookNotes || []).map(b => b.title.replace(/[《》]/g, '').trim().toLowerCase());
      const scored = RECO_BOOK_DB.map(book => {
        const bookTitleClean = book.title.replace(/[《》]/g, '').trim().toLowerCase();
        const alreadyHas = existingTitles.some(t => t.includes(bookTitleClean) || bookTitleClean.includes(t));
        let score = 0;
        const matchReasons = [];
        book.keywords.forEach(kw => {
          const lowerKw = kw.toLowerCase();
          if (profile.fullText.includes(lowerKw)) {
            const kwCount = profile.keywords.find(([k]) => k === kw);
            const weight = kwCount ? kwCount[1] : 1;
            score += weight;
            if (matchReasons.length < 3) matchReasons.push(kw);
          }
        });
        const catCount = profile.catCounts[book.cat] || 0;
        if (catCount > 0) { score += catCount * 2; }
        return { book, score, matchReasons, alreadyHas };
      });
      const recommendations = scored.filter(r => !r.alreadyHas && r.score > 0).sort((a, b) => b.score - a.score).slice(0, 8);
      if (recommendations.length < 6) {
        const recommendedTitles = new Set(recommendations.map(r => r.book.title));
        const fallback = scored.filter(r => !r.alreadyHas && !recommendedTitles.has(r.book.title)).sort((a, b) => {
          const aCat = profile.catCounts[a.book.cat] || 0;
          const bCat = profile.catCounts[b.book.cat] || 0;
          if (aCat !== bCat) return bCat - aCat;
          return b.score - a.score;
        }).slice(0, 8 - recommendations.length);
        recommendations.push(...fallback);
      }
      return { profile, recommendations };
    }

      state.bookNotes.push({

        readStatus: 'unread', readPage: '', created: nowText()

    function renderAllRecommendations(cats) {
      const { profile, recommendations } = generateBookRecommendations();
      const existingTitles = (state.bookNotes || []).map(b => b.title.replace(/[《》]/g, '').trim().toLowerCase());
      const availableBooks = RECO_BOOK_DB.filter(b => {
        const cleanTitle = b.title.replace(/[《》]/g, '').trim().toLowerCase();
        return !existingTitles.some(t => t.includes(cleanTitle) || cleanTitle.includes(t));
      });

      let html = `<div class="lib-section-title">全部推荐书（${availableBooks.length}本可读）</div>`;
      if (availableBooks.length === 0) {
        html += '<div class="empty">推荐书籍已全部加入书架！</div>';
        return html;
      }

      // 按分类分组展示
      cats.forEach(catInfo => {
        const catBooks = availableBooks.filter(b => b.cat === catInfo.key);
        if (catBooks.length === 0) return;
        const catRecos = recommendations.filter(r => r.book.cat === catInfo.key);
        const matchedIds = new Set(catRecos.map(r => r.book.title));

        html += `<div class="lib-cat-group" style="margin-bottom:18px;">
          <div class="lib-cat-group-header" style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
            <span style="font-size:18px;">${catInfo.icon}</span>
            <span style="font-size:14px;font-weight:800;color:${catInfo.color};">${catInfo.name}</span>
            <span style="font-size:11px;color:var(--muted);">（${catBooks.length}本）</span>
          </div>
          <div class="ai-reco-list">`;

        // AI匹配的优先显示
        catRecos.forEach(({ book, score, matchReasons }) => {
          const scoreLabel = score >= 10 ? '高度匹配' : score >= 5 ? '推荐匹配' : '值得一读';
          html += `<div class="ai-reco-item">
            <div class="ai-reco-cover" style="background: linear-gradient(135deg, ${catInfo.color}dd, ${catInfo.color}99);">${book.icon}</div>
            <div class="ai-reco-info">
              <div class="ai-reco-book-title">《${escapeHtml(book.title)}》</div>
              <div class="ai-reco-book-author">${escapeHtml(book.author)}</div>
              <div class="ai-reco-book-desc">${escapeHtml(book.desc)}</div>
              <div><span class="ai-reco-score-badge">${scoreLabel}</span>${matchReasons.map(r => `<span class="ai-reco-reason">🔗 ${escapeHtml(r)}</span>`).join('')}</div>
            </div>
            <button class="ai-reco-add-btn" onclick="addRecommendedBook('${book.title.replace(/'/g, "\\'")}','${book.author.replace(/'/g, "\\'")}','${book.cat}')">+ 加入</button>
          </div>`;
        });
        // 其他未匹配的
        catBooks.filter(b => !matchedIds.has(b.title)).forEach(book => {
          html += `<div class="ai-reco-item">
            <div class="ai-reco-cover" style="background: linear-gradient(135deg, ${catInfo.color}dd, ${catInfo.color}99);">${book.icon}</div>
            <div class="ai-reco-info">
              <div class="ai-reco-book-title">《${escapeHtml(book.title)}》</div>

              <div class="ai-reco-book-desc">${escapeHtml(book.desc)}</div>

          </div>`;
        });
        html += `</div></div>`;
      });
      return html;

    function renderCategoryRecommendations(catKey) {
      const catInfo = LIB_CATEGORIES.find(c => c.key === catKey);
      const { profile, recommendations } = generateBookRecommendations();
      const catRecos = recommendations.filter(r => r.book.cat === catKey);
      const allCatBooks = RECO_BOOK_DB.filter(b => b.cat === catKey);
      const existingTitles = (state.bookNotes || []).map(b => b.title.replace(/[《》]/g, '').trim().toLowerCase());
      const availableBooks = allCatBooks.filter(b => {
        const cleanTitle = b.title.replace(/[《》]/g, '').trim().toLowerCase();
        return !existingTitles.some(t => t.includes(cleanTitle) || cleanTitle.includes(t));
      });

      let html = `<div class="ai-reco-section" style="margin-top:0;">
        <div class="ai-reco-header">
          <div>
            <div class="ai-reco-title">📚 ${catInfo.icon} ${catInfo.name} · 推荐书单</div>
            <div class="ai-reco-subtitle">共${availableBooks.length}本可读 · ${catRecos.length}本AI精选匹配</div>
          </div>
        </div>`;

      if (availableBooks.length === 0) {
        html += '<div class="ai-reco-list"><div class="ai-profile-empty">该分类的推荐书籍已全部加入你的书架！</div></div>';
      } else {
        html += '<div class="ai-reco-list">';
        // 先显示AI匹配的
        const matchedIds = new Set(catRecos.map(r => r.book.title));
        catRecos.forEach(({ book, score, matchReasons }) => {
          const scoreLabel = score >= 10 ? '高度匹配' : score >= 5 ? '推荐匹配' : '值得一读';
          html += `<div class="ai-reco-item">
            <div class="ai-reco-cover" style="background: linear-gradient(135deg, ${catInfo.color}dd, ${catInfo.color}99);">${book.icon}</div>
            <div class="ai-reco-info">
              <div class="ai-reco-book-title">《${escapeHtml(book.title)}》</div>
              <div class="ai-reco-book-author">${escapeHtml(book.author)}</div>
              <div class="ai-reco-book-desc">${escapeHtml(book.desc)}</div>
              <div><span class="ai-reco-score-badge">${scoreLabel}</span>${matchReasons.map(r => `<span class="ai-reco-reason">🔗 ${escapeHtml(r)}</span>`).join('')}</div>
            </div>
            <button class="ai-reco-add-btn" onclick="addRecommendedBook('${book.title.replace(/'/g, "\\'")}','${book.author.replace(/'/g, "\\'")}','${book.cat}')">+ 加入</button>
          </div>`;
        });
        // 再显示其他未匹配的
        availableBooks.filter(b => !matchedIds.has(b.title)).forEach(book => {
          html += `<div class="ai-reco-item">
            <div class="ai-reco-cover" style="background: linear-gradient(135deg, ${catInfo.color}dd, ${catInfo.color}99);">${book.icon}</div>
            <div class="ai-reco-info">
              <div class="ai-reco-book-title">《${escapeHtml(book.title)}》</div>
              <div class="ai-reco-book-author">${escapeHtml(book.author)}</div>
              <div class="ai-reco-book-desc">${escapeHtml(book.desc)}</div>
            </div>
            <button class="ai-reco-add-btn" onclick="addRecommendedBook('${book.title.replace(/'/g, "\\'")}','${book.author.replace(/'/g, "\\'")}','${book.cat}')">+ 加入</button>
          </div>`;
        });
        html += '</div>';
      }
      html += '</div>';
      return html;
    }

    function cycleBookStatus(id) {

      const order = ['unread', 'reading', 'read'];
      const current = note.readStatus || 'unread';
      const next = order[(order.indexOf(current) + 1) % 3];
      note.readStatus = next;

    function saveManualNoteToBook(bookId) {
      const text = document.getElementById('bd-manual-input').value.trim();
      if (!text) { toast('请输入笔记内容'); return; }
      if (!state.bookNotes) return;
      const book = state.bookNotes.find(b => b.id === bookId);
      if (!book) return;
      if (!book.notes) book.notes = [];
      book.notes.push({ id: Date.now().toString() + Math.random().toString(36).slice(2), content: text, type: 'manual', created: nowText() });
      saveState();
      renderModule();
      toast('笔记已保存');
      // 检查思想熔炉关联
      checkBookCrucibleOnSave(book);
    }

    function saveImportToBook(bookId, type, textAreaId) {
      let text = '';
      if (type === 'weread') {
        text = document.getElementById('bd-weread-input').value.trim();
        // 尝试提取标注内容
        const lines = text.split('\n').filter(l => l.trim());
        if (lines.length > 3) {
          // 微信读书格式：尝试去除元数据行
          text = lines.filter(l => !l.match(/^[\d/年月日时分秒\s◆●○摘录笔记书名作者]+/) || l.length > 20).join('\n');
        }
      } else if (type === 'douban') {
        text = document.getElementById('bd-douban-input').value.trim();
      } else if (type === 'ocr') {
        text = document.getElementById(textAreaId || 'bd-ocr-text').value.trim();
      }
      if (!text) { toast('没有可保存的内容'); return; }
      if (!state.bookNotes) return;
      const book = state.bookNotes.find(b => b.id === bookId);
      if (!book) return;
      if (!book.notes) book.notes = [];
      book.notes.push({ id: Date.now().toString() + Math.random().toString(36).slice(2), content: text, type: type, created: nowText() });
      saveState();
      renderModule();
      toast('已保存为笔记');
      checkBookCrucibleOnSave(book);
    }

    function handleBookDetailOcr(event, bookId) {
      const file = event.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById('bd-ocr-status');
      statusEl.innerHTML = '⏳ 正在识别...';
      const reader = new FileReader();
      reader.onload = function(e) {
        // 使用Tesseract.js进行OCR（与现有OCR功能一致）
        if (typeof Tesseract !== 'undefined') {
          Tesseract.recognize(e.target.result, 'chi_sim+eng', {
            logger: m => { if (m.status === 'recognizing text') statusEl.innerHTML = '⏳ 识别中... ' + Math.round(m.progress * 100) + '%'; }
          }).then(result => {
            document.getElementById('bd-ocr-text').value = result.data.text.trim();
            document.getElementById('bd-ocr-result').style.display = 'block';
            statusEl.innerHTML = '✅ 识别完成';
          }).catch(err => {
            statusEl.innerHTML = '❌ 识别失败：' + err.message;
          });
        } else {
          // Tesseract未加载，提示手动输入
          statusEl.innerHTML = '⚠️ OCR引擎未加载，请手动输入识别内容';
          document.getElementById('bd-ocr-result').style.display = 'block';
          document.getElementById('bd-ocr-text').value = '';
        }
      };
      reader.readAsDataURL(file);
    }

    function deleteBookNoteItem(bookId, noteId) {
      if (!state.bookNotes) return;
      const book = state.bookNotes.find(b => b.id === bookId);
      if (!book || !book.notes) return;
      book.notes = book.notes.filter(n => n.id !== noteId);
      saveState();
      renderModule();
      toast('已删除该条笔记');

    function checkBookCrucibleOnSave(book) {
      const allText = (book.title || '') + ' ' + (book.notes || []).map(n => n.content).join(' ');
      if (!allText.trim()) return;
      const matchTopic = checkCrucibleAssociation(book.title, allText);
      if (matchTopic) {
        showCrucibleSyncPrompt(matchTopic, {
          bookTitle: book.title,
          readTime: nowText(),
          noteContent: allText
        });
      }
    }

    function renderBookAISummary(note, catInfo) {
      // 基于书籍信息生成AI内容提炼
      const allNotes = (note.notes || []).map(n => n.content).join(' ');
      const oldNote = note.note || '';
      const fullContent = (allNotes + ' ' + oldNote).trim();
      const title = note.title || '';
      const author = note.author || '';

      let html = `<div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,rgba(45,91,209,.06),rgba(71,107,216,.03));border:1px solid rgba(45,91,209,.12);">
        <div class="card-title" style="margin-bottom:14px;display:flex;align-items:center;gap:6px;">
          <span style="background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;">AI</span>
          🤖 AI内容提炼
        </div>`;

      if (!fullContent) {
        html += `<div style="font-size:13px;color:var(--muted);padding:12px;">添加笔记后，AI会自动提炼这本书的核心观点、关键概念和可转化为短视频内容的选题方向。</div>`;
        html += `</div>`;
        return html;
      }

      // 提炼核心关键词
      const keywords = extractBookKeywords(title, fullContent, catInfo);
      // 生成核心观点
      const viewpoints = generateBookViewpoints(title, author, fullContent, catInfo);
      // 生成内容选题方向
      const topics = generateBookTopics(title, catInfo, keywords);

      html += `<div style="margin-bottom:14px;">
        <div style="font-size:12px;font-weight:800;color:var(--accent);margin-bottom:8px;">🔑 核心关键词</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">${keywords.map(k => `<span class="tag tag-gray" style="font-size:12px;">${escapeHtml(k)}</span>`).join('')}</div>
      </div>`;

      html += `<div style="margin-bottom:14px;">
        <div style="font-size:12px;font-weight:800;color:var(--accent);margin-bottom:8px;">💡 核心观点提炼</div>`;
      viewpoints.forEach(v => {
        html += `<div style="background:rgba(255,255,255,.5);border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:13px;line-height:1.7;color:var(--ink);">${escapeHtml(v)}</div>`;
      });
      html += `</div>`;

      html += `<div style="margin-bottom:8px;">
        <div style="font-size:12px;font-weight:800;color:var(--accent);margin-bottom:8px;">🎬 可转化的内容选题</div>`;
      topics.forEach(t => {
        html += `<div style="background:rgba(45,91,209,.06);border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:13px;line-height:1.6;color:var(--ink);">▸ ${escapeHtml(t)}</div>`;

    // --- 微信读书标注解析 ---
    function parseWeReadImport() {
      const text = document.getElementById('weread-paste').value.trim();
      if (!text) { toast('请先粘贴内容'); return; }
      wereadParsedNotes = [];
      const lines = text.split('\n');
      let bookTitle = '', bookAuthor = '';
      let currentChapter = '';
      let highlights = [];
      let notes = [];

      // 尝试从第一行提取书名（通常被书名号包围或第一行）
      const titleMatch = text.match(/^[《【](.+?)[》】]/m) || text.match(/^(.+?)\n/);
      if (lines[0] && lines[0].trim().length < 50) {
        bookTitle = lines[0].replace(/[《【》】]/g, '').trim();
      }

      // 尝试从第二行提取作者
      if (lines[1] && lines[1].trim().length < 30 && !lines[1].includes('◆') && !lines[1].includes('>>')) {
        bookAuthor = lines[1].trim();
      }

      // 逐行解析标注和笔记
      let currentType = 'highlight'; // highlight 或 note
      let buffer = '';

      lines.forEach((line, idx) => {
        const trimmed = line.trim();
        if (!trimmed) return;

        // 章节标记
        if (trimmed.match(/^◆/) || trimmed.match(/^第[一二三四五六七八九十百千\d]+[章节卷回]/)) {
          if (buffer) { pushBuffer(buffer, currentType, highlights, notes); buffer = ''; }
          currentChapter = trimmed.replace(/^◆\s*/, '');
          currentType = 'highlight';
          return;
        }

        // 标注内容标记（>> 开头或 ◇ 开头）
        if (trimmed.match(/^[>＞◇]/)) {
          if (buffer) { pushBuffer(buffer, currentType, highlights, notes); buffer = ''; }
          buffer = trimmed.replace(/^[>＞◇]+\s*/, '');
          currentType = 'highlight';
          return;
        }

        // 笔记标记
        if (trimmed.match(/^(笔记|想法|注释|点评)[:：]/) || trimmed.match(/^[💭]/)) {
          if (buffer) { pushBuffer(buffer, currentType, highlights, notes); buffer = ''; }
          buffer = trimmed.replace(/^(笔记|想法|注释|点评)[:：]?\s*/, '').replace(/^[💭]\s*/, '');
          currentType = 'note';
          return;
        }

        // 累积多行内容
        if (buffer) {
          buffer += '\n' + trimmed;
        } else {
          // 可能是书名或作者之外的标注
          if (idx > 2 && trimmed.length > 10) {
            buffer = trimmed;
            currentType = 'highlight';
          }
        }
      });
      if (buffer) pushBuffer(buffer, currentType, highlights, notes);

      // 合并标注和笔记为一条笔记
      if (highlights.length === 0 && notes.length === 0) {
        // 无法解析结构，整体作为一条笔记
        wereadParsedNotes.push({
          title: bookTitle || '微信读书导入',
          author: bookAuthor,
          chapter: '',
          note: text.substring(0, 2000),
          source: '微信读书'
        });
      } else {
        // 将标注和笔记合并
        const maxLen = Math.max(highlights.length, notes.length);
        for (let i = 0; i < maxLen; i++) {
          let noteText = '';
          if (highlights[i]) noteText += '【标注】' + highlights[i].text + '\n';
          if (notes[i]) noteText += '【笔记】' + notes[i].text;
          if (noteText) {
            wereadParsedNotes.push({
              title: bookTitle || '微信读书导入',
              author: bookAuthor,
              chapter: highlights[i] && highlights[i].chapter ? highlights[i].chapter : currentChapter,
              note: noteText.trim(),
              source: '微信读书'
            });
          }
        }
      }

      renderImportPreview('weread-preview', wereadParsedNotes, 'weread');
    }

    function pushBuffer(text, type, highlights, notes) {
      const item = { text: text.trim() };
      if (type === 'highlight') highlights.push(item);
      else notes.push(item);
    }

    // --- 豆瓣书评解析 ---
    function parseDoubanImport() {
      const title = document.getElementById('douban-book-title').value.trim();
      const author = document.getElementById('douban-book-author').value.trim();
      const text = document.getElementById('douban-paste').value.trim();
      if (!text) { toast('请先粘贴内容'); return; }
      if (!title) { toast('请填写书名'); return; }
      doubanParsedNotes = [];

      // 尝试按星级分割多条评论（豆瓣短评通常以 ★★★★☆ 开头）
      const reviewParts = text.split(/(?=★{1,5}☆?)/).filter(s => s.trim().length > 5);

      if (reviewParts.length > 1) {
        // 多条短评
        reviewParts.forEach((part, idx) => {
          const cleanText = part.trim();
          const starMatch = cleanText.match(/★{1,5}☆?/);
          const stars = starMatch ? starMatch[0] : '';
          const content = cleanText.replace(/★{1,5}☆?/, '').trim();
          doubanParsedNotes.push({
            title: title,
            author: author,
            chapter: stars ? '豆瓣评分 ' + stars : '豆瓣短评 #' + (idx + 1),
            note: content,
            source: '豆瓣'
          });
        });
      } else {
        // 单条书评或无星级分割
        // 尝试按双换行分段
        const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 5);
        if (paragraphs.length > 1) {
          doubanParsedNotes.push({
            title: title,
            author: author,
            chapter: '豆瓣书评',
            note: text,
            source: '豆瓣'
          });
        } else {
          doubanParsedNotes.push({
            title: title,
            author: author,
            chapter: '豆瓣短评',
            note: text,
            source: '豆瓣'
          });
        }
      }

      renderImportPreview('douban-preview', doubanParsedNotes, 'douban');
    }

    // --- 拍照OCR ---
    function handleOcrImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      ocrCurrentImage = file;

      const reader = new FileReader();

    async function runOcrRecognition(file) {
      const statusEl = document.getElementById('ocr-status');
      const progressBar = document.getElementById('ocr-progress-bar');
      const progressFill = document.getElementById('ocr-progress-fill');
      const resultArea = document.getElementById('ocr-result-area');

      statusEl.textContent = '⏳ 正在加载OCR引擎...';
      statusEl.classList.add('show');
      progressBar.classList.add('show');
      progressFill.style.width = '10%';

      try {
        // 动态加载 Tesseract.js
        if (typeof Tesseract === 'undefined') {
          await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
        }

        statusEl.textContent = '🔍 正在识别文字，请稍候...';
        progressFill.style.width = '30%';

        const worker = await Tesseract.createWorker(['chi_sim', 'eng'], 1, {
          logger: m => {
            if (m.status === 'recognizing text') {
              progressFill.style.width = (30 + m.progress * 70) + '%';
              statusEl.textContent = '🔍 识别中... ' + Math.round(m.progress * 100) + '%';
            }
          }
        });

        const { data: { text } } = await worker.recognize(file);
        await worker.terminate();

        progressFill.style.width = '100%';
        statusEl.textContent = '✅ 识别完成';
        setTimeout(() => { statusEl.classList.remove('show'); progressBar.classList.remove('show'); }, 2000);

        // 显示结果
        const resultText = document.getElementById('ocr-result-text');
        const bookTitle = document.getElementById('ocr-book-title').value.trim();
        let finalText = text.trim();
        if (bookTitle) {
          finalText = '【来源】《' + bookTitle + '》纸质书划线\n\n' + finalText;
        }
        resultText.value = finalText;
        resultArea.style.display = 'block';
      } catch (err) {

    function classifyText(text) {
      const t = text.toLowerCase();
      const rules = [
        { key: "daily", words: ["已完成", "完成了", "做完", "打卡", "今天完成", "已发布", "已复盘", "已看书"] },
        { key: "content", words: ["点赞", "播放", "爆款", "热门", "最新视频", "视频内容", "对标", "选题", "标题", "占星爆款"] },
        { key: "editing", words: ["剪辑", "视频素材", "字幕", "封面", "bgm", "转场", "分镜", "口播视频", "帮我剪"] },
        { key: "writing", words: ["小内容", "金句", "灵感", "短观点", "文案", "脚本", "粉丝问题", "知识卡", "摘录"] },
        { key: "brain", words: ["怎么提高", "优化", "分析", "类目", "账号方向", "推荐skill", "推荐 skill", "最新适合"] },
        { key: "skills", words: ["skill", "skills", "技能", "提示词", "工作流", "模板"] },
        { key: "library", words: ["书", "书籍", "章节", "图书", "pdf", "docx", "课程", "资料", "荣格全集", "读书笔记"] },
        { key: "viral", words: ["爆款视频搜集", "视频链接", "同行视频", "评论区", "拆解"] }
      ];
      for (const rule of rules) {
        if (rule.words.some(w => t.includes(w.toLowerCase()))) return rule.key;
      }
      return activeModule || "writing";
    }

    function addChatMessage(role, text) {
      const key = activeModule + "_chat";
      if (!state[key]) state[key] = [];
      state[key].push({ role, text, time: nowText() });
      saveState();
    }

    function processChatCommand(module, text) {
      const t = text.toLowerCase();
      if (t.includes("推送") || t.includes("推送到")) {
        const target = Object.keys(moduleDefs).find(k => t.includes(moduleDefs[k].name) || t.includes(k));
        if (target && target !== module) {
          const items = state[module];
          if (items && items.length) {
            const last = items[items.length - 1];
            pushItem(module, last.id, target);
            return `已把【${moduleDefs[module].name}】最新内容推送到【${moduleDefs[target].name}】。`;
          }
          return `当前模块没有可推送的内容，先添加一条。`;
        }
      }
      if (t.includes("生成标题") || t.includes("标题")) return quickCommandReply("titles");
      if (t.includes("钩子") || t.includes("开头")) return quickCommandReply("hook");
      if (t.includes("脚本") || t.includes("口播")) return quickCommandReply("script60");
      if (t.includes("拆") || t.includes("结构")) return quickCommandReply("destructure");

    async function githubGetFileSha() {
      if (!githubSyncConfig) return null;
      const { username, repo, branch, token } = githubSyncConfig;
      try {
        const resp = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/workbench_data.json?ref=${branch}`, {
          headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (resp.ok) {
          const data = await resp.json();
          return data.sha;
        }
      } catch(e) {}
      return null;
    }

    async function githubPushNow() {
      if (!githubSyncConfig) { toast('请先配置 GitHub 同步'); return; }
      if (githubSyncing) { toast('正在同步中，请稍候...'); return; }
      githubSyncing = true;
      const statusEl = document.getElementById('gh-sync-status');
      if (statusEl) statusEl.textContent = '⏳ 正在同步到 GitHub...';
      const { username, repo, branch, token } = githubSyncConfig;
      try {
        // 上传前先拉取云端数据，合并云端有但本地没有的数据，防止互相覆盖
        var pullUrl = 'https://raw.githubusercontent.com/' + username + '/' + repo + '/' + branch + '/workbench_data.json';
        try {
          var pullResp = await fetch(pullUrl, { cache: 'no-store' });
          if (pullResp.ok) {
            var cloudData = await pullResp.json();
            var mergeArrays = ['diaries','bookNotes','crucible','questions','daily','content','editing','viral','writing','brain','skills','library'];
            var cloudAdded = 0;
            mergeArrays.forEach(function(key) {
              if (cloudData[key] && Array.isArray(cloudData[key])) {
                var localIds = new Set((state[key] || []).map(function(item) { return item.id; }));
                cloudData[key].forEach(function(item) {
                  if (item.id && !localIds.has(item.id)) {
                    state[key] = state[key] || [];
                    state[key].push(item);
                    cloudAdded++;
                  }
                });
              }
            });
            if (cloudAdded > 0) {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
              renderNav();
              console.log('上传前从云端合并了 ' + cloudAdded + ' 条数据');
            }
          }
        } catch(pullErr) { console.log('上传前拉取跳过:', pullErr.message); }

        const content = btoa(unescape(encodeURIComponent(JSON.stringify(state, null, 2))));
        if (!githubFileSha) githubFileSha = await githubGetFileSha();
        const body = {
          message: '工作台数据同步 ' + new Date().toLocaleString('zh-CN'),
          content: content,
          branch: branch
        };
        if (githubFileSha) body.sha = githubFileSha;
        var resp = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/workbench_data.json`, {
          method: 'PUT',
          headers: {
            'Authorization': 'token ' + token,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });
        // 409 冲突或 422 SHA 不匹配：重新获取 SHA 后重试一次
        if (resp.status === 409 || resp.status === 422) {
          console.log('SHA 过期，重新获取后重试...');
          githubFileSha = await githubGetFileSha();
          if (githubFileSha) body.sha = githubFileSha;
          else delete body.sha;
          resp = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/workbench_data.json`, {
            method: 'PUT',
            headers: {
              'Authorization': 'token ' + token,
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
          });
        }
        if (resp.ok) {
          const data = await resp.json();
          githubFileSha = data.content.sha;
          if (statusEl) statusEl.textContent = '✅ 上传成功 ' + new Date().toLocaleTimeString('zh-CN');
          toast('数据已同步到 GitHub');
        } else if (resp.status === 401) {
          if (statusEl) statusEl.textContent = '❌ Token 无效，请检查';
          toast('Token 无效，请重新配置');
        } else if (resp.status === 404) {
          if (statusEl) statusEl.textContent = '❌ 仓库不存在或无权限';
          toast('仓库不存在或Token无权限');
        } else {
          if (statusEl) statusEl.textContent = '❌ 上传失败 (' + resp.status + ')';
          toast('上传失败：' + resp.status);
        }
      } catch(e) {
        if (statusEl) statusEl.textContent = '❌ 网络错误';
        toast('同步失败：' + e.message);
      }
      githubSyncing = false;
    }

            <button onclick="performImport('merge')" style="padding:10px 16px;background:#28a745;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">🔗 合并导入（推荐）</button>
            <button onclick="performImport('replace')" style="padding:10px 16px;background:#dc3545;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">⚠️ 完全替换</button>
            <button onclick="document.getElementById('import-confirm-overlay').remove()" style="padding:10px 16px;background:#6c757d;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">取消</button>
          </div>
          <p style="font-size:11px;color:#999;margin-top:12px;line-height:1.5;">合并导入：只补充本地没有的数据，不会删除现有内容。<br>完全替换：用备份覆盖所有数据，建议先导出当前数据。</p>
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
    }

    function performImport(mode) {
      const data = _pendingImportData;
      if (!data) return;
      if (mode === 'replace') {
        if (!confirm('确定要完全替换所有数据吗？现有内容将被覆盖！\n\n建议先点取消，用「导出备份」保存当前数据后再替换。')) return;
      }
      if (mode === 'merge') {
        var mergeArrays = ['diaries','bookNotes','crucible','questions','daily','content','editing','viral','writing','brain','skills','library'];
        mergeArrays.forEach(function(key) {
          if (data[key] && Array.isArray(data[key])) {
            var localIds = new Set((state[key] || []).map(function(item) { return item.id; }));
            data[key].forEach(function(item) {
              if (item.id && !localIds.has(item.id)) {
                state[key] = state[key] || [];
                state[key].push(item);
              }
            });
          }
        });
        if (data.diary_chat && Array.isArray(data.diary_chat)) {
          data.diary_chat.forEach(function(item) { (state.diary_chat = state.diary_chat || []).push(item); });
        }
        toast('合并导入完成，已补充缺失的数据');
      } else if (mode === 'replace') {
        state = mergeBuiltInKnowledge(data);
        toast('数据已完全替换为备份内容');
      }
      saveState();
      renderNav();
      switchModule(state.activeModule || 'daily');
      _pendingImportData = null;
      var ov = document.getElementById('import-confirm-overlay');
      if (ov) ov.remove();
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // 初始化
    window.addEventListener('beforeunload', function() { flushDiarySave(); });
    // 请求持久化存储，防止浏览器自动清除 localStorage
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then(function(persistent) {
        if (persistent) console.log("存储已设为持久化，不会被浏览器自动清除");
      }).catch(function() {});
    }
    renderNav();
    switchModule(activeModule);
    // 立即从 workbench_data.json 恢复日记数据（防止 localStorage 丢失）
    restoreDiariesFromFile();
    // 同时从 IndexedDB 恢复日记（双重保险）
    idbRestoreDiaries();
    // 从 GitHub 拉取最新数据（云端同步）
    setTimeout(githubPullOnLoad, 1500);

    // 从飞书同步日记（只拉取飞书记录，不覆盖本地数据）
    setTimeout(loadFeishuDiaries, 2000);
  </script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister();});}).catch(function(){});}</script></body>
